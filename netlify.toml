[build]
  command = "npm run build"
  publish = "dist"

# Send API calls to the backend so the browser sees one origin (cookie auth, no CORS).
[[redirects]]
  from = "/api/*"
  to = "https://fleet-demo.165-232-96-216.sslip.io/api/:splat"
  status = 200
  force = true

# Single-page app: any other path serves index.html so reloads on /alerts etc. work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
